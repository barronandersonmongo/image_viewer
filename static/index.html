<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barry Image Viewer</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="flyoutHandle" class="flyout-handle" role="button" aria-label="Open controls" aria-controls="appHeader" aria-expanded="false" tabindex="0"></div>
  <div id="flyoutBackdrop" class="flyout-backdrop" hidden aria-hidden="true"></div>
  <div id="app">
    <header class="app-header collapsed" id="appHeader">
      <div class="header-bar">
        <div class="header-controls">
          <div class="order-switch" id="orderSwitch" role="group" aria-label="Sort order">
            <button type="button" class="order-option active" data-order="desc" aria-pressed="true">Newest</button>
            <button type="button" class="order-option" data-order="asc" aria-pressed="false">Oldest</button>
          </div>
          <button type="button" class="flyout-pin" id="flyoutPin" aria-pressed="false" aria-label="Pin controls">
            <span class="pin-indicator" aria-hidden="true"></span>
            <span class="pin-text">Auto</span>
          </button>
        </div>
      </div>
      <div class="control-content" id="controlContent" aria-hidden="true">
        <div class="control-tabs" role="tablist">
          <button type="button" class="control-tab active" data-tab="search" id="tabButtonSearch" role="tab" aria-selected="true" aria-controls="controlPanelSearch">Search</button>
          <button type="button" class="control-tab" data-tab="year" id="tabButtonYear" role="tab" aria-selected="false" aria-controls="controlPanelYear">Year</button>
          <button type="button" class="control-tab" data-tab="random" id="tabButtonRandom" role="tab" aria-selected="false" aria-controls="controlPanelRandom">Random</button>
        </div>
        <section class="control-panel" id="controlPanelSearch" role="tabpanel" aria-labelledby="tabButtonSearch">
          <form id="searchForm" class="search-form">
            <div class="search-row">
              <div class="search-combobox" id="searchCombobox" role="combobox" aria-expanded="false" aria-owns="searchSuggestions" aria-haspopup="listbox">
                <input type="search" id="searchInput" placeholder="Search by date or choose a year" aria-label="Search by date" aria-autocomplete="list" aria-controls="searchSuggestions">
                <ul class="search-suggestions" id="searchSuggestions" role="listbox" hidden></ul>
              </div>
              <button type="submit">Search</button>
            </div>
            <div class="search-history" aria-label="Search history">
              <button type="button" class="search-history-button" id="searchHistoryBack" aria-label="Previous search" disabled>Back</button>
              <button type="button" class="search-history-button" id="searchHistoryForward" aria-label="Next search" disabled>Forward</button>
            </div>
            <div class="search-score">
              <label for="searchScoreInput">Score cutoff</label>
              <input type="range" id="searchScoreInput" min="0" max="1" step="0.01" value="0.75" aria-describedby="searchScoreValue">
              <span class="search-score-value" id="searchScoreValue">0.75</span>
            </div>
          </form>
          <div class="search-results" id="searchResults"></div>
        </section>
        <section class="control-panel" id="controlPanelYear" role="tabpanel" aria-labelledby="tabButtonYear" hidden>
          <nav class="year-navigation" id="yearNavigation" aria-label="Jump to year" hidden>
            <p class="year-navigation-title" id="yearNavigationTitle">Jump to year</p>
            <div class="year-navigation-buttons" id="yearNavigationButtons" role="group" aria-labelledby="yearNavigationTitle"></div>
            <label class="year-navigation-select" for="yearNavigationSelect">
              <span>Jump to year</span>
              <select id="yearNavigationSelect"></select>
            </label>
          </nav>
        </section>
        <section class="control-panel" id="controlPanelRandom" role="tabpanel" aria-labelledby="tabButtonRandom" hidden>
          <section class="random-viewer" id="randomViewerSection">
            <header class="random-viewer-header">
              <div class="random-viewer-toggle" id="randomViewerToggleWrapper">
                <label class="toggle-switch">
                  <input type="checkbox" id="randomViewerToggle" aria-labelledby="randomViewerToggleLabel" aria-describedby="randomViewerHelp">
                  <span class="toggle-slider"><span class="toggle-handle"></span></span>
                </label>
                <label class="random-viewer-label" id="randomViewerToggleLabel" for="randomViewerToggle">Random image viewer</label>
              </div>
              <p class="random-viewer-help" id="randomViewerHelp">Cycle through photos automatically like a digital frame.</p>
            </header>
            <div class="random-viewer-settings" id="randomViewerSettings">
              <div class="random-setting">
                <label for="randomViewerDuration">Display time (seconds)</label>
                <input type="number" id="randomViewerDuration" min="3" max="300" step="1" value="10">
              </div>
              <div class="random-setting">
                <label for="randomViewerBlend">Fade duration (seconds)</label>
                <input type="number" id="randomViewerBlend" min="0" max="10" step="0.1" value="1">
              </div>
              <div class="random-setting random-dates">
                <fieldset>
                  <legend>Date range</legend>
                  <div class="date-range-inputs">
                    <label for="randomViewerStart">From</label>
                    <input type="date" id="randomViewerStart">
                    <label for="randomViewerEnd">To</label>
                    <input type="date" id="randomViewerEnd">
                  </div>
                </fieldset>
              </div>
              <div class="random-setting random-specific-dates">
                <fieldset>
                  <legend>Specific values</legend>
                  <div class="specific-date-input">
                    <input type="text" id="randomViewerSpecificInput" placeholder="e.g. 2023-12-24, 2025, Holidays">
                    <button type="button" id="randomViewerAddDate">Add group</button>
                  </div>
                  <div class="specific-date-chips" id="randomViewerDateChips" aria-live="polite"></div>
                </fieldset>
              </div>
            </div>
          </section>
        </section>
      </div>
    </header>
    <main class="timeline" id="timeline">
      <div class="download-bar download-bar-hidden" id="downloadControls">
        <div class="download-row">
          <span class="download-count" id="downloadCount" aria-live="polite" hidden></span>
        </div>
        <div class="download-action-row">
          <button type="button" class="download-action download-secondary" id="downloadClear" disabled>Clear</button>
          <button type="button" class="download-action download-primary" id="downloadButton" disabled>Download</button>
        </div>
        <p class="download-hint">Tip: use the checkbox on each thumbnail or “Select All” on a group header to build your download.</p>
      </div>
      <div class="timeline-sections" id="timelineSections"></div>
      <div class="timeline-loader" id="timelineLoader">Loading…</div>
    </main>
  </div>

  <div class="viewer-overlay" id="viewerOverlay" hidden>
    <div class="viewer-container" id="viewerContainer">
      <button class="viewer-close" id="viewerClose" type="button" aria-label="Close viewer">×</button>
      <div class="viewer-info-bar viewer-info-top" id="viewerInfoTop"></div>
      <div class="viewer-info-bar viewer-info-left" id="viewerInfoLeft"></div>
      <div class="viewer-stage">
        <button class="viewer-nav prev" id="viewerPrev" type="button" aria-label="Previous image">‹</button>
        <div class="viewer-image-stack">
          <img id="viewerImage" class="viewer-image viewer-image-main" alt="Selected image">
          <img id="viewerImageOverlay" class="viewer-image viewer-image-overlay" aria-hidden="true" hidden>
        </div>
        <button class="viewer-nav next" id="viewerNext" type="button" aria-label="Next image">›</button>
      </div>
      <section class="viewer-details-panel" id="viewerDetailsPanel" aria-labelledby="viewerDetailsTitle" hidden>
        <header class="viewer-details-header">
          <h2 id="viewerDetailsTitle">Photo Details</h2>
        </header>
        <div class="viewer-details-content" role="region" aria-live="polite">
          <p class="viewer-details-status" id="viewerDetailsStatus" hidden></p>
          <div class="viewer-details-scroll">
            <div class="viewer-details-section" id="viewerLocationSection" hidden>
              <h3 class="viewer-details-section-title">Location Details</h3>
              <table
                class="viewer-details-table viewer-details-table--wrap"
                id="viewerLocationTable"
                hidden
                aria-describedby="viewerDetailsTitle"
              >
                <tbody id="viewerLocationTableBody"></tbody>
              </table>
            </div>
            <div class="viewer-details-section" id="viewerExifSection" hidden>
              <h3 class="viewer-details-section-title">EXIF Details</h3>
              <table class="viewer-details-table" id="viewerExifTable" hidden aria-describedby="viewerDetailsTitle">
                <tbody id="viewerExifTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
      <div class="viewer-info-bar viewer-info-right" id="viewerInfoRight"></div>
      <div class="viewer-info-bar viewer-info-bottom" id="viewerInfoBottom"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="app.js?v=25"></script>
</body>
</html>
